name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  LIDARR_VERSION: 3.1.3.4968

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Lidarr reference assemblies
        run: |
          mkdir -p local/lidarr-ref
          curl -fsSL "https://github.com/Lidarr/Lidarr/releases/download/v${LIDARR_VERSION}/Lidarr.develop.${LIDARR_VERSION}.linux-core-x64.tar.gz" |
            tar xz --strip-components=1 -C local/lidarr-ref \
              Lidarr/Lidarr.Core.dll \
              Lidarr/Lidarr.Common.dll \
              Lidarr/NLog.dll \
              Lidarr/FluentValidation.dll

      - name: Restore
        run: dotnet restore AlbumArt.sln

      - name: Build
        run: dotnet build AlbumArt.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Lidarr.Plugin.AlbumArt.Tests/Lidarr.Plugin.AlbumArt.Tests.csproj -c Release --no-build
