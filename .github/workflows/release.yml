name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  LIDARR_VERSION: 3.1.3.4968

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Lidarr reference assemblies
        run: |
          mkdir -p local/lidarr-ref
          curl -fsSL "https://github.com/Lidarr/Lidarr/releases/download/v${LIDARR_VERSION}/Lidarr.develop.${LIDARR_VERSION}.linux-core-x64.tar.gz" |
            tar xz --strip-components=1 -C local/lidarr-ref \
              Lidarr/Lidarr.Core.dll \
              Lidarr/Lidarr.Common.dll \
              Lidarr/NLog.dll \
              Lidarr/FluentValidation.dll

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version beginning with v (for example v1.0.0)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "assembly_version=${version%%-*}.0" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore AlbumArt.sln

      - name: Build
        run: >
          dotnet build AlbumArt.sln -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/Lidarr.Plugin.AlbumArt.Tests/Lidarr.Plugin.AlbumArt.Tests.csproj -c Release --no-build

      - name: Package plugin
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          output="_plugins/Lidarr.Plugin.AlbumArt"
          staging="$RUNNER_TEMP/album-art-plugin"
          asset="$GITHUB_WORKSPACE/Lidarr.Plugin.AlbumArt.${version}.net8.0.zip"
          mkdir -p "$staging"
          rsync -a \
            --exclude '*.pdb' \
            --exclude 'Lidarr.Common.dll' \
            --exclude 'Lidarr.Core.dll' \
            --exclude 'NLog.dll' \
            --exclude 'FluentValidation.dll' \
            "$output/" "$staging/"
          test -f "$staging/Lidarr.Plugin.AlbumArt.dll"
          (cd "$staging" && zip -r "$asset" .)
          unzip -l "$asset"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lidarr.Plugin.AlbumArt.*.net8.0.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Minimum Lidarr Version: 3.1.2.4938

            Install in Lidarr: System → Plugins → paste this repository URL → Install → restart.

            See the generated notes below for changes in this release.
